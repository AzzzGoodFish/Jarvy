<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Jarvy</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --card: #fff; --line: #e4e4e7; --text: #18181b; --muted: #71717a; --accent: #18181b; --on-accent: #fff; --danger: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1c1c1f; --line: #2e2e33; --text: #f4f4f5; --muted: #a1a1aa; --accent: #f4f4f5; --on-accent: #18181b; --danger: #f87171; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif; -webkit-user-select: none; user-select: none; }
  main { width: min(420px, calc(100vw - 48px)); padding: 32px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  img { display: block; width: 48px; height: 48px; margin-bottom: 16px; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; -webkit-user-select: text; user-select: text; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; }
  code { display: block; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--line) 55%, transparent); font: 12px/1.6 ui-monospace, Consolas, monospace; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  button { height: 36px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .error { min-height: 20px; margin: 10px 0 0; color: var(--danger); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <form id="address">
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
    <label for="server" data-t="label"></label>
    <input id="server" type="text" autocomplete="off" spellcheck="false" placeholder="https://192.168.1.10:12520" autofocus>
    <p class="error" id="address-error" role="alert"></p>
    <div class="actions"><button class="primary" type="submit" data-t="next"></button></div>
  </form>
  <section id="check" hidden>
    <h1 data-t="checkTitle"></h1>
    <p data-t="checkIntro"></p>
    <code id="fingerprint"></code>
    <p class="error" id="check-error" role="alert"></p>
    <div class="actions"><button type="button" id="back" data-t="back"></button><button class="primary" type="button" id="accept" data-t="accept"></button></div>
  </section>
</main>
<script src="setup.js"></script>
</body>
</html>
