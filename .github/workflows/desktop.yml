# The desktop client (A96): builds the Windows installer and the Linux AppImage on every change to desktop/ or the
# connector and keeps them as the run's artifacts. The client has Jarvy's version: for a Jarvy release tag (v*) they
# go into that release, beside the npm package.
name: Desktop client

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", "src/connect/**", "src/contract/desktop.ts", "src/contract/device.ts", "src/contract/update.ts", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "src/connect/**", "src/contract/desktop.ts", "src/contract/device.ts", "src/contract/update.ts", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: jarvy-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The release is made by hand after npm publish (the release flow); wait for it, up to an hour.
        run: |
          for i in $(seq 1 120); do gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break; sleep 30; done
          gh release upload "$GITHUB_REF_NAME" $(ls release/*.exe release/*.AppImage 2>/dev/null) --clobber
